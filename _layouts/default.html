<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="theme-color" content="#0d2738">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap nav-wrap">
      <a class="brand" href="/" aria-label="AIMEX Lab home">
        <span class="brand-mark">A</span>
        <span>AIMEX Lab</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/publications/">Publications</a>
        <a href="https://github.com/AIMEX-GeoAI">GitHub</a>
        <a class="nav-cta" href="/contact/">Collaborate</a>
      </nav>
    </div>
  </header>

  <main class="wrap content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <div class="footer-title">AIMEX Lab</div>
        <div>Artificial Intelligence for Mineral Exploration Laboratory</div>
      </div>
      <div class="footer-links">
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/publications/">Publications</a>
        <a href="/contact/">Contact</a>
      </div>
    </div>
  </footer>
</body>
</html>
